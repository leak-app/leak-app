server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Runtime config is regenerated on every container start.
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Traefik terminates TLS upstream, so keep its forwarded scheme.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Apps Script served as plain text so the Profile card can copy it.
  location /sheet-template/ {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Vite emits content-hashed files here.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML is revalidated on every load: it references content-hashed assets that
  # disappear on the next deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /spa.html {
    add_header Cache-Control "no-cache";
  }

  # /privacy and /terms are pre-rendered to <path>/index.html (scripts/prerender.mjs);
  # every other route falls back to the SPA shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /spa.html;
  }
}
